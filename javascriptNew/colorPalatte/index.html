<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <title>Color Palette</title>
  </head>
  <body>
    <div class="container">
      <h1>Color Palette Generator</h1>
      <button class="generate-btn">
        <i class="ri-loop-right-line"></i>Generate Palette
      </button>
      <div class="color-palette">
        <div class="color-box">
          <div class="color" style="background-color: #51bdef"></div>
          <div class="color-info">
            <span class="hex-val">#E1F5FE</span>
            <i class="ri-file-copy-line copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
        <div class="color-box">
          <div class="color" style="background-color: #c01733"></div>
          <div class="color-info">
            <span class="hex-val">#C01733</span>
             <i class="ri-file-copy-line copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
        <div class="color-box">
          <div class="color" style="background-color: #eeee7d"></div>
          <div class="color-info">
            <span class="hex-val">#CA2442</span>
             <i class="ri-file-copy-line copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
        <div class="color-box">
          <div class="color" style="background-color: #24ab8e"></div>
          <div class="color-info">
            <span class="hex-val">#24AB8E</span>
             <i class="ri-file-copy-line copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
        <div class="color-box">
          <div class="color" style="background-color: #de17e1"></div>
          <div class="color-info">
            <span class="hex-val">#DE17E1</span>
             <i class="ri-file-copy-line copy-btn" title="Copy to clipboard"></i>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
